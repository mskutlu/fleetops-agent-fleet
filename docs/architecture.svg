<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8fa3bf"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b9dd9"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d95b5b"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#10151d"/>
  <text x="800" y="52" text-anchor="middle" fill="#e8eef7" font-size="30" font-weight="bold">FleetOps — Agent-Fleet Control Plane on Google Cloud</text>
  <text x="800" y="80" text-anchor="middle" fill="#8fa3bf" font-size="16">Fortified Enterprise Fleet track · Gemini API + Google ADK · Cloud Run · Pub/Sub · Firestore</text>

  <!-- ============ Clients ============ -->
  <rect x="40" y="180" width="230" height="240" rx="12" fill="#1a2230" stroke="#33415c" stroke-width="1.5"/>
  <text x="155" y="212" text-anchor="middle" fill="#e8eef7" font-size="19" font-weight="bold">Clients</text>
  <text x="155" y="236" text-anchor="middle" fill="#8fa3bf" font-size="14">ops engineers · upsystems</text>
  <rect x="60" y="258" width="190" height="42" rx="8" fill="#22304a" stroke="#3d5382"/>
  <text x="155" y="284" text-anchor="middle" fill="#c9d6ea" font-size="14">POST /incidents</text>
  <rect x="60" y="312" width="190" height="42" rx="8" fill="#22304a" stroke="#3d5382"/>
  <text x="155" y="338" text-anchor="middle" fill="#c9d6ea" font-size="14">GET /agents · /traces</text>
  <text x="155" y="392" text-anchor="middle" fill="#6d81a3" font-size="12.5">every request carries an</text>
  <text x="155" y="408" text-anchor="middle" fill="#6d81a3" font-size="12.5">agent principal token</text>

  <!-- ============ Gateway ============ -->
  <rect x="330" y="170" width="270" height="260" rx="12" fill="#1f2a3d" stroke="#5b9dd9" stroke-width="2"/>
  <text x="465" y="204" text-anchor="middle" fill="#9ec7ee" font-size="20" font-weight="bold">Agent Gateway</text>
  <text x="465" y="226" text-anchor="middle" fill="#8fa3bf" font-size="13.5">single entrypoint · FastAPI on Cloud Run</text>
  <rect x="350" y="244" width="230" height="40" rx="8" fill="#16202f" stroke="#33415c"/>
  <text x="465" y="269" text-anchor="middle" fill="#c9d6ea" font-size="13.5">① identity — validate principal</text>
  <rect x="350" y="294" width="230" height="40" rx="8" fill="#16202f" stroke="#33415c"/>
  <text x="465" y="319" text-anchor="middle" fill="#c9d6ea" font-size="13.5">② policy — scopes: dispatch/execute</text>
  <rect x="350" y="344" width="230" height="40" rx="8" fill="#16202f" stroke="#33415c"/>
  <text x="465" y="369" text-anchor="middle" fill="#c9d6ea" font-size="13.5">③ route by capability → agent</text>
  <text x="465" y="412" text-anchor="middle" fill="#6d81a3" font-size="12.5">decision span on every hop</text>

  <!-- ============ Agents ============ -->
  <rect x="660" y="150" width="420" height="300" rx="12" fill="#1a2230" stroke="#33415c" stroke-width="1.5"/>
  <text x="870" y="182" text-anchor="middle" fill="#e8eef7" font-size="19" font-weight="bold">Agent Fleet — Google ADK</text>
  <text x="870" y="203" text-anchor="middle" fill="#8fa3bf" font-size="13.5">Gemini 3.6-flash via Gemini API · MockLlm offline fallback</text>

  <rect x="800" y="220" width="140" height="52" rx="8" fill="#22304a" stroke="#5b9dd9" stroke-width="1.5"/>
  <text x="870" y="242" text-anchor="middle" fill="#9ec7ee" font-size="14.5" font-weight="bold">Planner</text>
  <text x="870" y="260" text-anchor="middle" fill="#8fa3bf" font-size="12">decomposes incident</text>

  <rect x="690" y="320" width="160" height="66" rx="8" fill="#22304a" stroke="#3d5382"/>
  <text x="770" y="345" text-anchor="middle" fill="#c9d6ea" font-size="14.5" font-weight="bold">Diagnoser</text>
  <text x="770" y="363" text-anchor="middle" fill="#8fa3bf" font-size="12">query_logs · check_metrics</text>
  <rect x="890" y="320" width="160" height="66" rx="8" fill="#22304a" stroke="#3d5382"/>
  <text x="970" y="345" text-anchor="middle" fill="#c9d6ea" font-size="14.5" font-weight="bold">Remediator</text>
  <text x="970" y="363" text-anchor="middle" fill="#8fa3bf" font-size="12">restart_service · scale_service</text>
  <text x="870" y="428" text-anchor="middle" fill="#6d81a3" font-size="12.5">dispatched only to registered + approved agent cards</text>

  <!-- ============ Model Armor ============ -->
  <rect x="1140" y="300" width="230" height="106" rx="12" fill="#2a1a1e" stroke="#d95b5b" stroke-width="2"/>
  <text x="1255" y="332" text-anchor="middle" fill="#f0a2a2" font-size="17" font-weight="bold">Model Armor</text>
  <text x="1255" y="354" text-anchor="middle" fill="#d9b8b8" font-size="13">pre-tool-call guardrail</text>
  <text x="1255" y="374" text-anchor="middle" fill="#d9b8b8" font-size="13">injection · PII · tool poisoning</text>
  <text x="1255" y="396" text-anchor="middle" fill="#a86d6d" font-size="12">blocked call → traced with reason</text>

  <!-- ============ Tools ============ -->
  <rect x="1430" y="316" width="130" height="74" rx="12" fill="#1a2230" stroke="#33415c"/>
  <text x="1495" y="346" text-anchor="middle" fill="#c9d6ea" font-size="15" font-weight="bold">Tools</text>
  <text x="1495" y="368" text-anchor="middle" fill="#8fa3bf" font-size="12">logs · metrics · ops</text>

  <!-- ============ Firestore / memory bank ============ -->
  <rect x="1140" y="480" width="420" height="200" rx="12" fill="#16202f" stroke="#3d8b6e" stroke-width="2"/>
  <text x="1350" y="512" text-anchor="middle" fill="#8fd4b8" font-size="19" font-weight="bold">Firestore</text>
  <text x="1350" y="534" text-anchor="middle" fill="#7ba394" font-size="13.5">memory bank · registry · trace store</text>
  <rect x="1160" y="552" width="380" height="38" rx="7" fill="#1d2b38" stroke="#2c4a3f"/>
  <text x="1350" y="576" text-anchor="middle" fill="#b5d9c9" font-size="13">agent cards (registry: approval + capabilities)</text>
  <rect x="1160" y="598" width="380" height="38" rx="7" fill="#1d2b38" stroke="#2c4a3f"/>
  <text x="1350" y="622" text-anchor="middle" fill="#b5d9c9" font-size="13">session + memory docs keyed by principal+topic</text>
  <rect x="1160" y="644" width="380" height="30" rx="7" fill="#1d2b38" stroke="#2c4a3f"/>
  <text x="1350" y="664" text-anchor="middle" fill="#b5d9c9" font-size="13">OTel trace spans</text>

  <!-- ============ Pub/Sub lane ============ -->
  <rect x="330" y="480" width="750" height="200" rx="12" fill="#16202f" stroke="#b09a4d" stroke-width="2"/>
  <text x="705" y="512" text-anchor="middle" fill="#e3cf87" font-size="19" font-weight="bold">Async Runtime — Cloud Run worker + Pub/Sub</text>
  <rect x="360" y="546" width="210" height="58" rx="8" fill="#1d2b38" stroke="#574f2c"/>
  <text x="465" y="570" text-anchor="middle" fill="#d9caa0" font-size="13.5" font-weight="bold">topic</text>
  <text x="465" y="590" text-anchor="middle" fill="#b3a379" font-size="13">fleetops-incidents</text>
  <rect x="620" y="546" width="200" height="58" rx="8" fill="#1d2b38" stroke="#574f2c"/>
  <text x="720" y="570" text-anchor="middle" fill="#d9caa0" font-size="13.5" font-weight="bold">pull subscription</text>
  <text x="720" y="590" text-anchor="middle" fill="#b3a379" font-size="13">fleetops-incidents-worker</text>
  <rect x="870" y="546" width="190" height="58" rx="8" fill="#1d2b38" stroke="#574f2c"/>
  <text x="965" y="570" text-anchor="middle" fill="#d9caa0" font-size="13.5" font-weight="bold">task executor</text>
  <text x="965" y="590" text-anchor="middle" fill="#b3a379" font-size="13">crash-resume from state</text>
  <text x="705" y="646" text-anchor="middle" fill="#7d7350" font-size="13">execution off the request path: incident accepted → task events drive planner → specialists</text>

  <!-- ============ Observability pipeline ============ -->
  <rect x="40" y="720" width="1520" height="230" rx="12" fill="#131a26" stroke="#33415c" stroke-width="1.5"/>
  <text x="800" y="754" text-anchor="middle" fill="#e8eef7" font-size="18" font-weight="bold">Agent Observability — OTel-compliant trace pipeline</text>
  <text x="800" y="778" text-anchor="middle" fill="#8fa3bf" font-size="13.5">every hop emits a span: planner decision · gateway route+policy · guardrail block · tool call · memory read/write</text>

  <rect x="120" y="806" width="380" height="56" rx="8" fill="#1d2b38" stroke="#33415c"/>
  <text x="310" y="830" text-anchor="middle" fill="#c9d6ea" font-size="13.5">traces persisted to Firestore</text>
  <text x="310" y="850" text-anchor="middle" fill="#7d8fa9" font-size="12">ordered chain per incident</text>
  <rect x="620" y="806" width="380" height="56" rx="8" fill="#1d2b38" stroke="#33415c"/>
  <text x="810" y="830" text-anchor="middle" fill="#c9d6ea" font-size="13.5">one-page dashboard · /trace/{incident_id}</text>
  <text x="810" y="850" text-anchor="middle" fill="#7d8fa9" font-size="12">rejections / guardrail blocks red-highlighted</text>
  <rect x="1120" y="806" width="380" height="56" rx="8" fill="#1d2b38" stroke="#33415c"/>
  <text x="1310" y="830" text-anchor="middle" fill="#c9d6ea" font-size="13.5">Cloud Trace-compatible span model</text>
  <text x="1310" y="850" text-anchor="middle" fill="#7d8fa9" font-size="12">audit + replay after the fact</text>

  <!-- ============ Arrows ============ -->
  <!-- clients -> gateway -->
  <line x1="270" y1="280" x2="326" y2="280" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>
  <!-- gateway -> planner -->
  <line x1="600" y1="246" x2="796" y2="240" stroke="#5b9dd9" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="700" y="230" text-anchor="middle" fill="#5b9dd9" font-size="12">allow → route</text>
  <!-- gateway reject -->
  <line x1="465" y1="434" x2="465" y2="476" stroke="#d95b5b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
  <text x="465" y="468" text-anchor="middle" fill="#d95b5b" font-size="12">401/403 reject → traced</text>
  <!-- planner -> specialists -->
  <line x1="820" y1="272" x2="790" y2="316" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="920" y1="272" x2="950" y2="316" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>
  <!-- specialists <-> memory -->
  <line x1="1054" y1="340" x2="1136" y2="520" stroke="#3d8b6e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1136" y1="560" x2="1054" y2="368" stroke="#3d8b6e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1116" y="450" text-anchor="middle" fill="#3d8b6e" font-size="12">recall before acting ·</text>
  <text x="1116" y="466" text-anchor="middle" fill="#3d8b6e" font-size="12">write summary after</text>
  <!-- tool path with armor -->
  <line x1="1050" y1="353" x2="1136" y2="353" stroke="#d95b5b" stroke-width="2" marker-end="url(#arrRed)"/>
  <line x1="1370" y1="353" x2="1426" y2="353" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1398" y="392" text-anchor="middle" fill="#8fa3bf" font-size="11.5">only if clean</text>
  <line x1="1255" y1="300" x2="1255" y2="268" stroke="#d95b5b" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="1255" y="258" text-anchor="middle" fill="#d95b5b" font-size="11.5">block → span logged</text>
  <!-- incident intake -> pubsub -->
  <line x1="465" y1="170" x2="465" y2="128" stroke="#b09a4d" stroke-width="0" />
  <path d="M 395 260 L 310 260" stroke="none"/>
  <path d="M 350 476 L 350 575 L 356 575" stroke="#b09a4d" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="302" y="500" text-anchor="middle" fill="#b09a4d" font-size="12">202 accepted →</text>
  <text x="302" y="516" text-anchor="middle" fill="#b09a4d" font-size="12">event emitted</text>
  <!-- pubsub chain -->
  <line x1="570" y1="575" x2="616" y2="575" stroke="#b09a4d" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="820" y1="575" x2="866" y2="575" stroke="#b09a4d" stroke-width="2" marker-end="url(#arr)"/>
  <!-- executor -> agents -->
  <line x1="965" y1="542" x2="940" y2="390" stroke="#b09a4d" stroke-width="2" marker-end="url(#arr)"/>
  <!-- registry check -->
  <line x1="1140" y1="566" x2="1084" y2="566" stroke="#3d8b6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="1112" y="556" text-anchor="middle" fill="#3d8b6e" font-size="11.5">registry lookup</text>
  <!-- spans pipeline -->
  <line x1="310" y1="802" x2="616" y2="834" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1000" y1="834" x2="1116" y2="834" stroke="#8fa3bf" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1350" y1="684" x2="1350" y2="802" stroke="#8fa3bf" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- footer -->
  <text x="800" y="980" text-anchor="middle" fill="#5d6f8c" font-size="13">Built for the All Things Agentic Hackathon (#AllThingsAgenticHackathon) · repo: github.com/mskutlu/fleetops-agent-fleet · live: fleetops-qiedvqu63a-ew.a.run.app</text>
</svg>
