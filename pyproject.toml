[project]
name = "fleetops"
version = "0.1.0"
description = "FleetOps - enterprise agent-fleet control plane (ADK + Gemini + GCP)"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
    # Stage 2c — OpenTelemetry-compliant trace emission (only new deps)
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "mcp-clickhouse>=0.4",
]

[project.optional-dependencies]
gcp = ["google-cloud-pubsub>=2.21", "google-cloud-firestore>=2.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fleetops"]
